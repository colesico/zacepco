
# 
# Script meta information
# 
metainfo:
  
  # Script schema version (data model version)
  # SimVer (semver.org) notation (i.e. 1.2.3)
  schema: 1.0.0
  
  # Unique script id
  # Can only consist of ASCII letters, numbers, underscore '_'
  id: zacepco
  title: Script document
  
  # A brief crime summary without spoilers
  annotation: |
    Defines the complete reference model of the script document
  
  # Script authors
  authors:
  - Vladlen V. Ларионов
  
  # License under which the script is distributed
  licence: CC BY 4.0
  
  # Script creation date YYYY-MM-DD
  creationDate: 2026-01-01
  
  # Script version (1..N)
  version: 1
  
  # Game difficulty
  # Dimensionless coefficient [0..1].
  # 0 - easy; 1 - highly difficult.
  difficulty: 0.0
  
  # Estimated playtime, minutes
  estimatedTime:
    min: 5
    max: 60
  
  # Recommended number of players (min-max)
  playersNum:
    min: 1
    max: 8

# 
# Crime specification
# Describes entire crime environment
# 
crime:
  
  # Crime duration in ticks
  crimeDuration: 5
  
  # 
  # Personages dictionary.
  # Defines all personages involved in the crime
  # 
  personages:
  - 
    # Unique within script ID
    # Must match the corresponding asset ID
    # Format: [PLCTD][A-Z0-9]{1,3}
    id: P1
    
    # Short name
    name: Butler
    
    # Detailed description
    description: |
      Knows all the secrets and secret passages,  is cold-blooded, has the perfect motive for murder.
    
    # Optional asset ID
    # Used when appropriate asset id is not match the entity id
    asset: P1
    
    # Hidden personage or not (default - false)
    hidden: true
    
    # Initially revealed clues for this personage
    revealedClues: [C1, C2]
    
    # Personage event log for each time tick
    # Each element of the array corresponds to a time tick, starting from 1.
    # Used to verify the investigation's findings (answers)
    log:
    - 
      # Personage destination location
      location: L2
      
      # Clue the character interacted with.
      # Reflects the change of interaction state - gave, got,  noticed  ...
      clue: C2
  
  # 
  # Crime scene definition
  # 
  scene:
    
    # Grid size for locations placement
    size:
      rows: 3 # Rows number
      cols: 2 # Columns number
    
    # 
    # Locations dictionary
    # 
    locations:
    - id: L1
      name: Cabinet
      description: |
        A gloomy study with dark shadows  shaped like Rorschach blots.
      
      # Location position on scene grid
      # (1,1) - left top scene corner
      pos:
        col: 1
        row: 1
      
      # Hidden location or not  (default - false)
      hidden: true
      
      # Initially revealed clues for this location
      revealedClues: [C1, C2]
      
      # Location event log for each time tick
      # Each element of the array corresponds to a time tick, starting from 1.
      # Used to verify the investigation's findings
      log:
      - 
        # Personages that was in this location at given time tick
        personages: [P1, P2]
        
        # Clue associated with the location
        clues: [C1, C2]
    
    # Connections between two locations.
    # Always connects only two locations, direction does not matter.
    connections:
    - 
      # IDs of the two connected locations
      locations: [L1, L2]
      
      # Is hidden transition or not (default - false)
      hidden: true
  
  # 
  # Clues dictionary
  # 
  clues:
  - id: C1
    name: Butt
    description: |
      A Camel cigarette butt
    
    # False clue or not (default-false)
    falsity: true
    
    # Entities to be open along with this clue
    open: [L2]

# 
# Investigation spec
# 
investigation:
  
  # Investigation budget in resource units
  budget: 9
  
  # Randomness factor [1.0 .. 0.0]. Default = 1.0
  # Used to recalculate investigation table thresholds to adjust randomness.
  # New_threshold = Table_threshold/randFactor
  randFactor: 1.0
  
  # 
  # Location search specification
  # 
  search:
    
    # Cost in resource units of investigation action on subject (int)
    cost: 3
    
    # Base points for investigation action (int)
    points: 2
    
    # Maximum number of elements in detective focus
    focusLimit: 3
    
    # Cost of obtaining investigation subject statistics
    # (-1) - statistics is prohibited
    statCost: -1
    
    # Locations to be searched
    locations:
    - 
      # Location to be search
      location: L3
      clues:
      - 
        # Entities on which investigation action is focused
        focus: [C3, P2, T2]
        
        # Clue discovery threshold
        threshold: 8.1
        
        # Target clue
        clue: C1
  
  # 
  # Personage interrogation specification
  # 
  interrogation:
    cost: 4
    points: 3
    focusLimit: 3
    statCost: -1
    
    # Personage to be interrogated
    personages:
    - 
      # Personage ID
      personage: P1
      
      # Personage clues
      clues:
      - focus: [T2, P1, L3]
        threshold: 7.0
        clue: C2
  
  # 
  # Criminal expertise specification
  # 
  expertise:
    cost: 5
    points: 5
    focusLimit: 3
    statCost: -1
    
    # Examined clues
    clues:
    - focus: [C1, C2, P3, L2]
      threshold: 3.0
      clue: C6
  
  # 
  # Detectives dictionary
  # 
  detectives:
  - id: D1
    name: Sherlock Holmes
    description: Famous detective

# 
# General answers
# 
answers:
  
  # Full crime fabula
  fabula: |
    The Gardener killed the Butler,  buried the body under a birch tree in the garden,  and burned the evidence in the fireplace in the library.
  
  # Planned crime solving strategy. Example:
  # - Search library L2 -> C1
  # - Interrogate gardener P3 -> C4
  strategy:
  - Search location L1 -> C1
  - Interrogate P1 with focus C1
