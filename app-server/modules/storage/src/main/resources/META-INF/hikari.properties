# Base connection settings
jdbcUrl=jdbc:postgresql://localhost:5432/zacepco
username=postgres
password=postgres

# Connection pool settings for PostgreSQL
maximumPoolSize=10
minimumIdle=2

# Timeouts (in milliseconds)
connectionTimeout=30000
maxLifetime=1800000
idleTimeout=600000

# Pool name for logging purposes
poolName=PostgreSQLHikariPool
