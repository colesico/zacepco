# Base connection settings
# Use ZACEPCO_JDBC_URL env variable to override this value
jdbcUrl=jdbc:sqlite:./db/zacepco.db

# Connection pool settings for SQLite
maximumPoolSize=1
minimumIdle=1

# Timeouts (in milliseconds)
connectionTimeout=30000
maxLifetime=0
idleTimeout=0

# Pool name for logging purposes
poolName=SQLiteHikariPool

# Driver-specific SQLite settings
dataSource.date_class=text
dataSource.date_string_format=yyyy-MM-dd HH:mm:ss
dataSource.foreign_keys=true
dataSource.busy_timeout=5000
dataSource.journal_mode=WAL