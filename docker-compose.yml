services:
  zacepco-postgres:
    image: postgres:16-alpine
    container_name: zacepco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-zacepco}
    ports:
      - "5432:5432"
    networks:
      - zacepco-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zacepco}"]
      interval: 5s
      timeout: 5s
      retries: 6
    volumes:
      - zacepco-pgdata:/var/lib/postgresql/data

  zacepco-app:
    image: zacepco-app:latest
    container_name: zacepco-app
    restart: unless-stopped
    depends_on:
      zacepco-postgres:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://zacepco-postgres:5432/${DB_NAME:-zacepco}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - zacepco-net
    volumes:
      - zacepco-storage:/opt/app/storage

  zacepco-nginx:
    build:
      context: .
      dockerfile: Dockerfile
    image: zacepco-nginx:latest
    container_name: zacepco-nginx
    restart: unless-stopped
    depends_on:
      zacepco-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - zacepco-storage:/opt/app/storage:ro
      # for SSL certs
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - zacepco-net


volumes:
  zacepco-pgdata:
    name: zacepco-pgdata
  zacepco-storage:
    name: zacepco-storage

networks:
  zacepco-net:
    name: zacepco-network
    driver: bridge