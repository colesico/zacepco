#
# Script meta information
#
metainfo:
  schema: 1.0.0
  uid: ZACEPCO
  version: 1
  title: Script example
  annotation: |
    Demonstrates script document model

    Morning at Maryino came too quietly. Someone did not come down
    to breakfast. On the grounds fresh earth showed dark, and on
    the table a glass still stood untouched. The estate remembers
    more than its residents will say.
  authors:
  - Vladlen V. Larionov
  licence: CC BY 4.0
  creationDate: '2026-01-01'
  difficulty: 0.0
  estimatedTime:
    min: 1
    max: 5
  playersNum:
    min: 1
    max: 4
  age: 18+

#
# Crime phase specification
# Describes objective crime world, initial investigation state,
# and answer verification data.
#
crime:

  # Full crime fabula
  # Used to verify the investigation's findings (answers)
  fabula: |
    Solid (PSLD) met Transparent (PTRN) in the castle (LCST),
    killed him, carried the body across the sunny beach (LBCH)
    to the hill (LMNT) and buried it there, then disposed of
    the remaining evidence at the camping (LCMP).

  # Crime timeline. Defines all possible ticks
  timeline:
    T1: '10:00'
    T2: '10:30'
    T3: '11:15'
    T4: '12:45'
    T5: '14:00'
    T6: '15:30'
    T7: '17:00'

  #
  # Personages
  # clues  — all clues ever associated with the personage (summary)
  # log    — per-tick location; 'clue' is a clue appearing at that tick
  #
  personages:

    PFCE:
      name: Happy face
      description: |
        Emoji happy face
      ref: ZACEPCO
      clues: [CFPR, CPEN]
      log:
        T1:
          location: LCST
          clue: CFPR
        T2:
          location: LCST
          clue: CPEN
        T3:
          location: LBCH
        T4:
          location: LHSE
        T5:
          location: LHSE
        T6:
          location: LHSE
        T7:
          location: LHSE

    PJOY:
      name: Joyful man
      description: Joyful personage
      clues: [CKEY]
      log:
        T1:
          location: LBCH
        T2:
          location: LBCH
        T3:
          location: LBCH
        T4:
          location: LBCH
        T5:
          location: LHSE
          clue: CKEY
        T6:
          location: LHSE
        T7:
          location: LHSE

    PTRN:
      name: Transparent
      description: Transparent personage
      clues: [CGUN]
      log:
        T1:
          location: LCMP
          clue: CGUN
        T2:
          location: LRIV
        T3:
          location: LBCH
        T4:
          location: LCST
        T5:
          location: LBCH
        T6:
          location: LMNT
        T7:
          location: LMNT

    PSLD:
      name: Solid
      description: Solid round personage
      hidden: true
      log:
        T1:
          location: LCST
        T2:
          location: LCST
        T3:
          location: LCST
        T4:
          location: LCST
        T5:
          location: LBCH
        T6:
          location: LMNT
        T7:
          location: LCMP

  #
  # Crime scene
  #
  scene:

    name: Maryino Estate

    size:
      cols: 4
      rows: 3

    #
    # Locations
    # clues — all clues ever associated with the location (summary)
    # log   — per-tick personages and clues appearing at the location
    #
    locations:

      LCST:
        name: Castle
        description: |
          Castle with red flag
        ref: ZACEPCO
        pos: {col: 2, row: 1}
        clues: [CSGT, CHMR, CGLS]
        log:
          T1:
            personages: [PFCE, PSLD]
            clues: [CSGT]
          T2:
            personages: [PFCE, PSLD]
          T3:
            personages: [PJOY, PSLD]
          T4:
            personages: [PSLD, PTRN]
            clues: [CHMR, CGLS]

      LBCH:
        name: Sunny beach
        description: |
          Three sun loungers and a beach umbrella
        pos: {col: 2, row: 2}
        log:
          T1:
            personages: [PJOY]
          T2:
            personages: [PJOY]
          T3:
            personages: [PFCE, PTRN]
          T4:
            personages: [PJOY]
          T5:
            personages: [PSLD, PTRN]

      LCMP:
        name: Camping
        description: |
          Two camping tents and a campfire pit
          with smoldering embers
        pos: {col: 3, row: 3}
        log:
          T1:
            personages: [PTRN]
          T7:
            personages: [PSLD]

      LWOD:
        name: Pine woods
        description: |
          A small pinewood with a glade
        pos: {col: 4, row: 3}

      LHSE:
        name: Abandoned house
        description: |
          People say there are ghosts here
        pos: {col: 1, row: 2}
        clues: [CCLK]
        log:
          T1:
            clues: [CCLK]
          T4:
            personages: [PFCE]
          T5:
            personages: [PFCE, PJOY]
          T6:
            personages: [PFCE, PJOY]
          T7:
            personages: [PFCE, PJOY]

      LRIV:
        name: River
        description: |
          Fast current, deep bottom
        pos: {col: 3, row: 2}
        log:
          T2:
            personages: [PTRN]

      LMNT:
        name: Hill
        pos: {col: 2, row: 3}
        hidden: true
        clues: [CBRY]
        log:
          T6:
            personages: [PSLD, PTRN]
            clues: [CBRY]
          T7:
            personages: [PTRN]

    #
    # Ways between two locations
    #
    ways:
      WCB:
        description: length 10m
        locations: [LCST, LBCH]
      WBR:
        locations: [LBCH, LRIV]
      WBH:
        locations: [LBCH, LHSE]
      WRC:
        locations: [LRIV, LCMP]
      WCW:
        locations: [LCMP, LWOD]
      WBM:
        locations: [LBCH, LMNT]
        hidden: true
      WMC:
        locations: [LMNT, LCMP]
        hidden: true

  #
  # Clues
  # discovered — visible to detectives at start (default: false)
  # falsity    — false clue (answer verification data)
  # reveals    — entities opened when this clue becomes discovered
  # leadsTo    — target entities this clue logically points to (answers)
  #
  clues:

    CFPR:
      name: Fingerprint
      description: |
        Left on a spoon
      ref: ZACEPCO
      falsity: true
      discovered: true

    CSGT:
      name: Cigarette butt
      discovered: true

    CHMR:
      name: Hammer
      description: A fingerprint on the handle
      reveals: [LMNT, WBM, WMC]
      leadsTo: [LMNT, PSLD]

    CCLK:
      name: Clock
      description: The clock hands stopped at 5:15
      leadsTo: [LHSE]

    CKEY:
      name: Key
      description: An old rusty key
      leadsTo: [PJOY, LHSE]

    CGLS:
      name: Glass
      description: A full martini glass
      leadsTo: [PTRN, LCST]

    CPEN:
      name: Yellow pen
      description: A metal body
      reveals: [PSLD]
      leadsTo: [PSLD]

    CGUN:
      name: Gun
      description: Calibre .25
      falsity: true
      leadsTo: [PTRN]

    CBRY:
      name: Buried body
      description: A hand protrudes from the fresh earth
      reveals: [CGUN]
      leadsTo: [PTRN, LMNT, PSLD]

    CEXP:
      name: Expert report
      description: The evidence matches
      leadsTo: [CFPR, CGLS]

    CEXN:
      name: Expert report
      description: The evidence does not match
      asset: CEXP
      leadsTo: [CGUN, CKEY]

#
# Investigation phase specification
#
investigation:

  budget: 9

  # Planned crime solving strategy
  strategy:
    - location: LCST
      focus: [T4, PTRN]
      result: CHMR
    - location: LMNT
      focus: [T6, PTRN]
      result: CBRY
    - personage: PFCE
      focus: [T2, LCST]
      result: CPEN

  search:
    cost: 3
    points: 1
    focusLimit: 1
    statCost: -1
    clues:
      CHMR:
        focus: [T4, PSLD, PTRN]
        threshold: 5.5
      CGLS:
        focus: [T4, PTRN]
        threshold: 4.5
      CCLK:
        focus: [T1, LHSE]
        threshold: 6.0
      CBRY:
        focus: [T6, PSLD, PTRN]
        threshold: 7.0

  interrogation:
    cost: 2
    points: 2
    focusLimit: 2
    statCost: -1
    clues:
      CPEN:
        focus: [T2, LCST]
        threshold: 5.5
      CKEY:
        focus: [T5, PJOY, LHSE]
        threshold: 6.0

  examination:
    cost: 1
    points: 3
    focusLimit: 3
    statCost: -1
    clues:
      CEXP:
        focus: [CFPR, CGLS]
        threshold: 3.0
      CEXN:
        focus: [CGUN, CKEY]
        threshold: 4.0

  detectives:
    DHLS:
      name: Sherlock Holmes
      description: Famous detective
    DPRO:
      name: Hercule Poirot
      description: Little grey cells
    DBRN:
      name: Father Brown
      description: Catholic priest who solves crimes
    DCOS:
      name: Cosmonaut