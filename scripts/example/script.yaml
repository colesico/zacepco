
# 
# Script meta information
# 
metainfo:
  
  # Script schema version (data model version)
  # SimVer (semver.org) notation (i.e. 1.2.3)
  schema: 1.0.0
  
  # Unique script identifier
  # Can only consist of ASCII uppercase letters, numbers, underscore '_'
  uid: ZACEPCO
  
  # Script version (1..N)
  version: 1
  
  # Script title
  title: Script example
  
  # A brief crime summary without spoilers
  # and version information
  annotation: |
    Demonstrates script document model
  
  # Authors list
  authors:
  - Vladlen V. Ларионов
  
  # License under which the script is distributed
  licence: CC BY 4.0
  
  # Script creation date YYYY-MM-DD
  creationDate: '2026-01-01'
  
  # Game estimated difficulty level
  # Dimensionless coefficient [0..1]
  # 0 - easy; 1 - highly difficult
  difficulty: 0.0
  
  # Estimated playtime, minutes
  estimatedTime:
    min: 1
    max: 5
  
  # Recommended number of players (min-max)
  playersNum:
    min: 1
    max: 4
  
  # Recommended age for players
  # Example: 18+ or 4-10
  age: 18+

# 
# Crime phase specification
# Describes objective crime world
# and initial state for investigation
# 
crime:
  
  # Full crime fabula
  # Used to verify the investigation's findings (answers)
  fabula: |
    The Gardener killed the Butler, buried the body under a birch tree in the garden,  and burned the evidence in the fireplace in the library.
  
  # Crime timeline. Defines all possible ticks
  # Example: T1: 10:00 or with date  T2: 2025-01-02T20:00
  # Specify either the time only or the date-time only, mixing formats is not allowed.
  timeline:
    T1: '10:00'
    T2: '10:30'
    T3: 2025-01-02T11:15
    T4: 2025-01-03T10:15
    T5: 2025-01-04T04:44
  
  # 
  # Character definitions
  # Defines all characters involved in the crime,
  # their initial investigation state, and answer data
  # Character ID - unique within the script
  # ID format: P[A-Z0-9]{1,3}
  # 
  personages:
    PFCE:
      
      # Short name
      name: Happy face
      
      # Optional description
      description: |
        Emoji happy face
      
      # Optional referenced script
      # If this entity is imported from another script,
      # specify that script UID
      ref: ZACEPCO
      
      # Personage related clues
      clues: [CFPR, CSGT]
      
      # Personage log for each tick
      # Used to verify the investigation's findings (answers)
      log:
        T1:
          
          # Personage destination location for tick
          # Initial character location not specified - it refers to the previous tick
          location: LCST
          
          # Clue linked to this personage during the tick
          clue: CFPR
        T2:
          location: L3
    PJOY:
      name: Joyful man
      description: |
        Joyful personage
    PTRN:
      name: Transparent
      description: "Transparent personage \n"
    PSLD:
      name: Solid
      description: Solid round personage
      
      # Initially hidden personage or not
      # Default: false
      hidden: true
  
  # 
  # Crime scene definition
  # 
  scene:
    
    # Scene short name
    name: Maryino Estate
    
    # Grid size for locations placement
    size:
      cols: 4 # Columns number
      rows: 3 # Rows number
    
    # 
    # Locations dictionary
    # Defines all crime locations,
    # their initial investigation state, and answer data
    # Location ID - unique within script
    # ID format: L[A-Z0-9]{1,3}
    # 
    locations:
      LCST:
        name: Castle
        description: |
          Castle with red flag
        ref: ZACEPCO
        
        # Location position on scene grid
        # (1,1) - left top scene corner
        pos: {col: 2, row: 1}
        
        # Location related clues
        clues: [CHMR]
        
        # Location log
        # Each element corresponds to a time tick
        # Used to verify the investigation's findings (answers)
        log:
          T3:
            
            # Time tick id
            tick: T3
            
            # Personages whose destination is this location for the given tick
            personages: [PFCE, PJOY]
            
            # Clues linked to this location during the tick
            clues: [CFPR, CSGT]
      LBCH:
        name: Sunny beach
        description: |
          Three sun loungers and a beach umbrella
        pos: {col: 2, row: 2}
      LCMP:
        name: Camping
        description: "Two camping tents and a campfire pit \nwith smoldering embers\n"
        pos: {col: 3, row: 3}
      LWOD:
        name: Pine woods
        description: |
          A small pinewood with a glade
        pos: {col: 4, row: 3}
      LHSE:
        name: Abandoned house
        description: |
          People say there are ghosts here
        pos: {col: 1, row: 2}
      LRIV:
        name: River
        description: |
          Fast current, deep bottom
        pos: {col: 3, row: 2}
      LMNT:
        name: Hill
        pos: {col: 2, row: 3}
        
        # Initially hidden location or not
        # Default: false
        hidden: true
    
    # Ways between two locations
    # Always connects only two locations, direction does not matter
    # There can be only one direct way between two locations
    # Way ID - unique within script
    # ID format: W[A-Z0-9]{1,3}
    ways:
      WCB:
        description: length 10m
        
        # IDs of the two connected locations
        locations: [LCST, LBCH]
      WBR:
        locations: [LBCH, LRIV]
      WBH:
        locations: [LBCH, LHSE]
      WRC:
        locations: [LRIV, LCMP]
      WCW:
        locations: [LCMP, LWOD]
      WBM:
        locations: [LBCH, LMNT]
        
        # Is initially hidden way or not
        # Default: false
        hidden: true
      WMC:
        locations: [LMNT, LCMP]
        hidden: true
  
  # 
  # Clues dictionary
  # Defines all clues involved in the crime
  # their initial investigation state, and answer data
  # Clue ID - unique within script
  # ID format: C[A-Z0-9]{1,3}
  # 
  clues:
    CFPR:
      name: Fingerprint
      description: |
        Left on a spoon
      ref: ZACEPCO
      
      # False clue or not
      # Default: false
      # Used as answers to verify the investigation's findings
      falsity: true
    CSGT:
      name: Cigarette butt
      
      # Initially revealed clue or not
      # Default: false
      discovered: true
      
      # Entities that this clue reveals (characters, locations, other clues)
      reveals: [LMNT]
      
      # Target entities that this clue leads to
      # Used as answers to verify the investigation results
      leadsTo: [PJOY]
    CHMR:
      name: Hammer
      description: A fingerprint on the handle
    CCLK:
      name: Clock
      description: The clock hands stopped at 5:15
    CKEY:
      name: Key
      description: An old rusty key
    CGLS:
      name: Glass
      description: A full martini glass
    CPEN:
      name: Yellow pen
      description: A metal body
    CGUN:
      name: Gun
      description: Calibre .25
    CEXP:
      name: Заключение экспертизы
      description: Улики совпадают
    CEXN:
      name: Заключение экспертизы
      description: Улики не совпадают
      
      # To use an image from another entity, specify the ID of that entity.
      # Omit this field if the entity uses its own individual image.
      asset: CEXP

# 
# Investigation phase specification
# Describes investigation model and its params
# 
investigation:
  
  # Investigation budget in resource units
  # Default: 2147483647
  budget: 9
  
  # Planned crime solving strategy.
  # Specify field:
  # 'location' for search;
  # 'personage' for interrogation;
  # nothing for expertise
  # 
  # Example for location search:
  # - location: L2
  # focus: [T4,C2]
  # result: C5
  strategy:
  - 
    # Location ID to search
    location: L2
    
    # Detective focus
    focus: [T4, C1]
    
    # Clue obtained
    result: C8
  
  # 
  # Location search specification
  # 
  search:
    
    # Cost in resource units of investigation action on subject (int)
    cost: 3
    
    # Base points for investigation action (int)
    points: 1
    
    # Maximum number of elements in detective focus
    focusLimit: 1
    
    # Cost of obtaining investigation subject statistics
    # (-1) - statistics is prohibited
    # (0) - free statistics
    # Default:  0
    statCost: -1
    
    # Location clues to be uncovered
    clues:
      C1:
        
        # Entities on which investigation action is focused
        focus: [C3, P2, T2]
        
        # Clue uncover threshold
        # Default: 0.0
        threshold: 8.1
  
  # 
  # Personage interrogation specification
  # 
  interrogation:
    cost: 2
    points: 2
    focusLimit: 2
    statCost: -1
    
    # Personage clues to be uncovered
    clues:
      C2:
        focus: [T2, P1, L3]
        threshold: 7.0
  
  # 
  # Criminal expertise specification
  # 
  expertise:
    cost: 1
    points: 3
    focusLimit: 3
    statCost: -1
    
    # Examined clues
    clues:
      C6:
        focus: [C1, C2, P3, L2]
        threshold: 3.0
  
  # 
  # Detectives dictionary
  # A subset of which can participate in the investigation
  # 
  detectives:
    DHLS:
      name: Sherlock Holmes
      description: Famous detective
    DPRO:
      name: Hercule Poirot
      description: Little grey cells
    DBRN:
      name: Father Brown
      description: Catholic priest who solves crimes
    DCOS:
      name: Cosmonaut
