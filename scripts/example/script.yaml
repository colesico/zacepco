
# 
# Script meta information
# 
metainfo:
  
  # Script schema version (data model version)
  # SimVer (semver.org) notation (i.e. 1.2.3)
  schema: 1.0.0
  
  # Unique script identifier
  # Can only consist of ASCII uppercase letters, numbers, underscore '_'
  uid: ZACEPCO
  
  # Script version (1..N)
  version: 1
  
  # Script title
  title: Script example
  
  # A brief crime summary without spoilers
  # and version information
  annotation: |
    Demonstrates script document model.

    Morning at Maryino came too quietly. Someone did not come down
    to breakfast. On the grounds fresh earth showed dark, and on
    the table a glass still stood untouched. The estate remembers
    more than its residents will say.
  
  # Authors list
  authors:
  - Vladlen V. Larionov
  
  # License under which the script is distributed
  licence: CC BY 4.0
  
  # Script creation date YYYY-MM-DD
  creationDate: '2026-01-01'
  
  # Game estimated difficulty level
  # Dimensionless coefficient [0..1]
  # 0 - easy; 1 - highly difficult
  difficulty: 0.0
  
  # Estimated playtime, minutes
  estimatedTime:
    min: 1
    max: 5
  
  # Recommended number of players (min-max)
  playersNum:
    min: 1
    max: 4
  
  # Recommended age for players
  # Example: 18+ or 4-10
  age: 18+

# 
# Crime phase specification
# Describes objective crime world,
# initial state for investigation
# and answer verification data
# 
crime:
  
  # Full crime fabula
  # Used to verify the investigation's findings (answers)
  fabula: |
    Solid (PSLD) met Transparent (PTRN) in the castle (LCST),
    killed him, carried the body across the sunny beach (LBCH)
    to the hill (LMNT) and buried it there, then disposed of
    the remaining evidence at the camping (LCMP).
  
  # Crime timeline. Defines all possible ticks
  # Example: T1: 10:00 or with date  T2: 2025-01-02T20:00
  # Specify either the time only or the date-time only, mixing formats is not allowed.
  timeline:
    T1: '10:00'
    T2: '10:30'
    T3: '11:15'
    T4: '12:45'
    T5: '14:00'
    T6: '15:30'
    T7: '17:00'
  
  # 
  # Character definitions
  # Defines all characters involved in the crime,
  # their initial investigation state, and answer data
  # Character ID - unique within the script
  # ID format: P[A-Z0-9]{1,3}
  # 
  personages:
    PFCE:
      
      # Short name
      name: Happy face
      
      # Optional description
      description: |
        Emoji happy face
      
      # Optional referenced script
      # If this entity is imported from another script,
      # specify that script UID
      ref: ZACEPCO
      
      # Personage related clues
      clues: [CFPR, CPEN]
      
      # Personage log for each tick
      # Used to verify the investigation's findings (answers)
      log:
        T1:
          
          # Personage destination location for tick
          # Initial character location not specified - it refers to the previous tick
          location: LCST
          
          # Clues linked to this personage during the tick
          clues: [CFPR]
        T2:
          location: LCST
          clues: [CPEN]
        T3:
          location: LBCH
        T4:
          location: LHSE
        T5:
          location: LHSE
        T6:
          location: LHSE
        T7:
          location: LHSE
    PJOY:
      name: Joyful man
      description: Joyful personage
      clues: [CKEY]
      log:
        T1:
          location: LBCH
        T2:
          location: LBCH
        T3:
          location: LBCH
        T4:
          location: LBCH
        T5:
          location: LHSE
          clues: [CKEY]
        T6:
          location: LHSE
        T7:
          location: LHSE
    PTRN:
      name: Transparent
      description: Transparent personage
      clues: [CGUN]
      log:
        T1:
          location: LCMP
          clues: [CGUN]
        T2:
          location: LRIV
        T3:
          location: LBCH
        T4:
          location: LCST
        T5:
          location: LBCH
        T6:
          location: LMNT
        T7:
          location: LMNT
    PSLD:
      name: Solid
      description: Solid round personage
      
      # Initially hidden personage or not
      # Default: false
      hidden: true
      log:
        T1:
          location: LCST
        T2:
          location: LCST
        T3:
          location: LCST
        T4:
          location: LCST
        T5:
          location: LBCH
        T6:
          location: LMNT
        T7:
          location: LCMP
  
  # 
  # Crime scene definition
  # 
  scene:
    
    # Scene short name
    name: Maryino Estate
    
    # Grid size for locations placement
    size:
      cols: 4 # Columns number
      rows: 3 # Rows number
    
    # 
    # Locations dictionary
    # Defines all crime locations,
    # their initial investigation state, and answer data
    # Location ID - unique within script
    # ID format: L[A-Z0-9]{1,3}
    # 
    locations:
      LCST:
        name: Castle
        description: |
          Castle with red flag
        ref: ZACEPCO
        
        # Location position on scene grid
        # (1,1) - left top scene corner
        pos: {col: 2, row: 1}
        
        # Location related clues
        clues: [CSGT, CHMR, CGLS]
        
        # Location log
        # Each element corresponds to a time tick
        # Used to verify the investigation's findings (answers)
        log:
          T1:
            
            # Time tick id
            tick: T1
            
            # Personages whose destination is this location for the given tick
            personages: [PFCE, PSLD]
            
            # Clues linked to this location during the tick
            clues: [CSGT]
          T2:
            tick: T2
            personages: [PFCE, PSLD]
          T3:
            tick: T3
            personages: [PJOY, PSLD]
          T4:
            tick: T4
            personages: [PSLD, PTRN]
            clues: [CHMR, CGLS]
      LBCH:
        name: Sunny beach
        description: |
          Three sun loungers and a beach umbrella
        pos: {col: 2, row: 2}
        log:
          T1:
            tick: T1
            personages: [PJOY]
          T2:
            tick: T2
            personages: [PJOY]
          T3:
            tick: T3
            personages: [PFCE, PTRN]
          T4:
            tick: T4
            personages: [PJOY]
          T5:
            tick: T5
            personages: [PSLD, PTRN]
      LCMP:
        name: Camping
        description: |
          Two camping tents and a campfire pit
          with smoldering embers
        pos: {col: 3, row: 3}
        log:
          T1:
            tick: T1
            personages: [PTRN]
          T7:
            tick: T7
            personages: [PSLD]
      LWOD:
        name: Pine woods
        description: |
          A small pinewood with a glade
        pos: {col: 4, row: 3}
      LHSE:
        name: Abandoned house
        description: |
          People say there are ghosts here
        pos: {col: 1, row: 2}
        clues: [CCLK]
        log:
          T1:
            tick: T1
            clues: [CCLK]
          T4:
            tick: T4
            personages: [PFCE]
          T5:
            tick: T5
            personages: [PFCE, PJOY]
          T6:
            tick: T6
            personages: [PFCE, PJOY]
          T7:
            tick: T7
            personages: [PFCE, PJOY]
      LRIV:
        name: River
        description: |
          Fast current, deep bottom
        pos: {col: 3, row: 2}
        log:
          T2:
            tick: T2
            personages: [PTRN]
      LMNT:
        name: Hill
        pos: {col: 2, row: 3}
        
        # Initially hidden location or not
        # Default: false
        hidden: true
        clues: [CBRY]
        log:
          T6:
            tick: T6
            personages: [PSLD, PTRN]
            clues: [CBRY]
          T7:
            tick: T7
            personages: [PTRN]
    
    # Ways between two locations
    # Always connects only two locations, direction does not matter
    # There can be only one direct way between two locations
    # Way ID - unique within script
    # ID format: W[A-Z0-9]{1,3}
    ways:
      WCB:
        description: length 10m
        
        # IDs of the two connected locations
        locations: [LCST, LBCH]
      WBR:
        locations: [LBCH, LRIV]
      WBH:
        locations: [LBCH, LHSE]
      WRC:
        locations: [LRIV, LCMP]
      WCW:
        locations: [LCMP, LWOD]
      WBM:
        locations: [LBCH, LMNT]
        
        # Is initially hidden way or not
        # Default: false
        hidden: true
      WMC:
        locations: [LMNT, LCMP]
        hidden: true
  
  # 
  # Clues dictionary
  # Defines all clues involved in the crime
  # their initial investigation state, and answer data
  # Each clue must be discoverable via search, interrogation, examination, or auto-discovery
  # Clue ID - unique within script
  # ID format: C[A-Z0-9]{1,3}
  # 
  clues:
    CFPR:
      name: Fingerprint
      description: |
        Left on a spoon
      ref: ZACEPCO
      
      # Initially discovered clue or not
      # (i.e. visible to detectives at investigation start)
      # Default: false
      discovered: true
      
      # False clue or not
      # Default: false
      # Used as answers to verify the investigation's findings
      falsity: true
    CSGT:
      name: Cigarette butt
      discovered: true
    CHMR:
      name: Hammer
      description: A fingerprint on the handle
      
      # Entities opened when this clue becomes discovered:
      # characters, locations, ways, other clues
      uncovers: [LMNT, WBM, WMC]
      
      # Target entities this clue logically points to
      # Used as answers to verify the investigation results
      leadsTo: [LMNT, PSLD]
    CCLK:
      name: Clock
      description: The clock hands stopped at 5:15
      leadsTo: [LHSE]
    CKEY:
      name: Key
      description: An old rusty key
      leadsTo: [PJOY, LHSE]
    CGLS:
      name: Glass
      description: A full martini glass
      leadsTo: [PTRN, LCST]
    CPEN:
      name: Yellow pen
      description: A metal body
      uncovers: [PSLD]
      leadsTo: [PSLD]
    CGUN:
      name: Gun
      description: Calibre .25
      falsity: true
      leadsTo: [PTRN]
    CBRY:
      name: Buried body
      description: A hand protrudes from the fresh earth
      uncovers: [CGUN]
      leadsTo: [PTRN, LMNT, PSLD]
    CEXP:
      name: Expert report
      description: The evidence matches
      leadsTo: [CFPR, CGLS]
    CEXN:
      name: Expert report
      description: The evidence does not match
      
      # To use an image from another entity, specify the ID of that entity.
      # Omit this field if the entity uses its own individual image.
      asset: CEXP
      leadsTo: [CGUN, CKEY]

# 
# Investigation phase specification
# Describes investigation model and its params
# 
investigation:
  
  # Investigation budget in resource units
  # Default: 2147483647
  budget: 16
  
  # Planned crime solving strategy.
  # Example for location search:
  # - inspection: SEARCH
  # target: L2
  # focus: [T4,C2]
  # result: C5
  strategy:
  - 
    # Inspection type
    # Possible values: SEARCH, INTERROGATION, EXAMINATION
    inspection: INTERROGATION
    
    # Entity ID to inspect
    target: PFCE
    
    # Detective focus
    focus: [T2, LCST]
    
    # Clue obtained
    result: CPEN
  - inspection: SEARCH
    target: LCST
    focus: [T4, PSLD]
    result: CHMR
  - inspection: SEARCH
    target: LMNT
    focus: [T6, PSLD]
    result: CBRY
  - inspection: INTERROGATION
    target: PJOY
    focus: [T5, LHSE]
    result: CKEY
  - inspection: SEARCH
    target: LHSE
    focus: [T1, LHSE]
    result: CCLK
  
  # 
  # Search specification
  # for location or personage
  # 
  search:
    
    # Cost in resource units of inspection on subject (int)
    cost: 3
    
    # Base points for inspection (int)
    points: 3
    
    # Maximum number of elements in detective focus
    focusLimit: 2
    
    # Cost of obtaining inspection subject statistics
    # (-1) - statistics is prohibited
    # (0) - free statistics
    # Default:  0
    statCost: -1
    
    # Location clues to be uncovered
    clues:
      CHMR:
        
        # Entities on which investigation action is focused
        focus: [T4, PSLD, PTRN]
        
        # Clue uncover threshold
        # Default: 0.0
        threshold: 6.5
      CGLS:
        focus: [T4, PTRN]
        threshold: 3.5
      CCLK:
        focus: [T1, LHSE]
        threshold: 4.0
      CBRY:
        focus: [T6, PSLD, PTRN]
        threshold: 7.0
      CGUN:
        focus: [T1, LCMP, PTRN]
        threshold: 2.0
  
  # 
  # Personage interrogation specification
  # 
  interrogation:
    cost: 2
    points: 2
    focusLimit: 2
    statCost: 0
    
    # Personage clues to be uncovered
    clues:
      CPEN:
        focus: [T2, LCST]
        threshold: 4.5
      CKEY:
        focus: [T5, PJOY, LHSE]
        threshold: 3.5
  
  # 
  # Criminal examination specification
  # 
  examination:
    cost: 2
    points: 2
    focusLimit: 2
    statCost: 1
    
    # Examination clues spec
    clues:
      CEXP:
        focus: [CFPR, CGLS]
        threshold: 4.0
      CEXN:
        focus: [CGUN, CKEY]
        threshold: 5.0
  
  # 
  # Detectives dictionary
  # A subset of which can participate in the investigation
  # 
  detectives:
    DHLS:
      name: Sherlock Holmes
      description: Famous detective
    DPRO:
      name: Hercule Poirot
      description: Little grey cells
    DBRN:
      name: Father Brown
      description: Catholic priest who solves crimes
    DCOS:
      name: Cosmonaut
