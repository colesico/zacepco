# Global limits and proxy settings
client_max_body_size 4M;
server_tokens off;

limit_req_status 429;
limit_conn_status 429;

# Real IP (uncomment if nginx is behind a proxy/CDN)
# set_real_ip_from 10.0.0.0/8;
# set_real_ip_from 172.16.0.0/12;
# set_real_ip_from 192.168.0.0/16;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# Geo whitelist and mapping
geo $whitelist {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    # Add other trusted CIDRs here, e.g.:
    # 192.168.1.0/24 1;
}

map $whitelist $limit_zone {
    0 $binary_remote_addr;
    1 "";
}

# Rate limit zones
limit_conn_zone $limit_zone zone=server_conn:16m;
limit_req_zone $limit_zone zone=server_req:10m rate=4r/s;
limit_req_zone $limit_zone zone=api:10m rate=10r/s;
limit_req_zone $limit_zone zone=resources:10m rate=24r/s;

# Upstream definition for backend application
upstream app_server {
    server zacepco-app:8080;
    keepalive 32;
}

# Reject connections for any unauthorized domains (default server)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    return 444;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name zacepco.net www.zacepco.net;
    return 301 https://zacepco.net$request_uri;
}

# Redirect HTTPS WWW to HTTPS non-WWW
server {
    listen 443 ssl;
    server_name www.zacepco.net;

    ssl_certificate /etc/nginx/ssl/domain.crt;
    ssl_certificate_key /etc/nginx/ssl/domain.key;

    return 301 https://zacepco.net$request_uri;
}

# Main server config
server {
    listen 443 ssl;
    server_name zacepco.net;

    ssl_certificate /etc/nginx/ssl/domain.crt;
    ssl_certificate_key /etc/nginx/ssl/domain.key;

    limit_conn server_conn 64;
    limit_req zone=server_req burst=10 nodelay;

    # Static file optimization
    sendfile on;
    tcp_nopush on;

    # Common proxy headers and keepalive to upstream
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Location resources (static files)
    location = /resources {
        return 301 /resources/;
    }

    location /resources/ {
        alias /usr/share/nginx/html/resources/;
        autoindex off;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, no-transform";
        limit_req zone=resources burst=24 nodelay;
    }

    # Location file storage (internal only, served via X-Accel-Redirect)
    location /storage/ {
        internal;
        alias /var/lib/armario/filestore/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, no-transform";
    }

    # Location API investigation (more specific prefix)
    location = /api/investigation {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://app_server;
    }

    location /api/investigation/ {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://app_server;
    }

    # Location general API
    location = /api {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://app_server;
    }

    location /api/ {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://app_server;
    }

    # Other application routes
    location = /investigation {
        proxy_pass http://app_server;
    }

    location /investigation/ {
        proxy_pass http://app_server;
    }

    location = /identity {
        proxy_pass http://app_server;
    }

    location /identity/ {
        proxy_pass http://app_server;
    }

    location = /docman {
        proxy_pass http://app_server;
    }

    location /docman/ {
        proxy_pass http://app_server;
    }

    # Root location (fallback)
    location / {
        proxy_pass http://app_server;
    }
}