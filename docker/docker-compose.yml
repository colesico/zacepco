version: '3.8'

services:
  zacepco-postgres:
    image: postgres:16-alpine
    container_name: zacepco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-zacepco}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - zacepco-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-zacepco}"]
      interval: 5s
      timeout: 5s
      retries: 6
    volumes:
      - zacepco-pgdata:/var/lib/postgresql/data

  zacepco-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zacepco-app
    restart: unless-stopped
    depends_on:
      zacepco-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@zacepco-postgres:5432/${DB_NAME:-zacepco}?sslmode=disable
    ports:
      - "8080:8080"
    networks:
      - zacepco-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  zacepco-pgdata:
    name: zacepco-pgdata

networks:
  zacepco-net:
    name: zacepco-network
    driver: bridge